<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Archived session delete">
  <!-- Drawn to match the other plugins in this profile: the same 36x36 rounded tile,
       the same vertical blue gradient, and white 1.6px line art with round joins.
       The glyph is this plugin's own subject — an archive box (lid plus body) with a
       minus inside it, reading as "remove from the archive" rather than a bare
       rubbish bin, which would lose the archived half of the meaning. -->
  <rect x="3" y="3" width="30" height="30" rx="8" fill="url(#a)" />
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9.2" y="9.2" width="17.6" height="4.4" rx="1.4" />
    <rect x="10.6" y="15.4" width="14.8" height="11.2" rx="2" />
    <path d="M14.9 21H21.1" />
  </g>
  <defs>
    <linearGradient id="a" x1="18" y1="3" x2="18" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AC2FF" />
      <stop offset="1" stop-color="#4A65E8" />
    </linearGradient>
  </defs>
</svg>
